<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpendWise</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;padding:20px}
.container{max-width:500px;margin:auto;background:white;padding:20px;border-radius:10px}
h1{text-align:center;color:#2d6a4f}
input,select,button{width:100%;padding:10px;margin:5px 0;border-radius:5px;border:1px solid #ccc}
button{background:#2d6a4f;color:white;border:none;cursor:pointer}
button:hover{background:#1b4332}
ul{list-style:none;padding:0}
li{background:#eee;padding:10px;margin:5px 0;border-radius:5px;display:flex;justify-content:space-between}
.delete{background:red;padding:5px 10px;width:auto}
</style>
</head>
<body>
<div class="container">
<h1>SpendWise 💰</h1>
<p>Total: $<span id="total">0</span></p>
<input type="text" id="name" placeholder="Magaca kharashka - e.g Lunch">
<input type="number" id="amount" placeholder="Lacagta - e.g 5">
<select id="category">
<option value="Lunch">Lunch</option>
<option value="Transport">Transport</option>
<option value="Shopping">Shopping</option>
<option value="Other">Other</option>
</select>
<button onclick="addExpense()">Add Expense</button>
<ul id="list"></ul>
</div>
<script>
let expenses = JSON.parse(localStorage.getItem("expenses") || "[]");
function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";
  let total = 0;
  expenses.forEach((e,i)=>{
    total += Number(e.amount);
    list.innerHTML += `<li>${e.name} - ${e.category} - $${e.amount} <button class="delete" onclick="removeExpense(${i})">X</button></li>`;
  });
  document.getElementById("total").textContent = total;
}
function addExpense(){
  let name = document.getElementById("name").value;
  let amount = document.getElementById("amount").value;
  let category = document.getElementById("category").value;
  if(!name || !amount) return alert("Fadlan buuxi magaca iyo lacagta");
  expenses.push({name, amount, category});
  localStorage.setItem("expenses", JSON.stringify(expenses));
  document.getElementById("name").value="";
  document.getElementById("amount").value="";
  render();
}
function removeExpense(i){
  expenses.splice(i,1);
  localStorage.setItem("expenses", JSON.stringify(expenses));
  render();
}
render();
</script>
</body>
</html>
